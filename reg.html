<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register Page</title>

    <link rel="stylesheet" href="CSS/reg.css">
</head>
<body>

 
    <div class="form.me">

    <form action="">

        <legend>Join the our Exclusive and Upscale Community!</legend>

    <br><br>

    
        <label for="fname"> First Name : </label>
        <input type="text" id="fname" placeholder="e.g. Austin" required>
        <br><br>

        <label for="sname"> Sir Name : </label>
        <input type="text" id="sname" placeholder="e.g. Wahome" required>
        <br><br>

        <label for="idname"> ID : </label>
        <input type="text" id="idname" placeholder="48965426" required>
        <br><br>

        <label for="ename"> Email : </label>
        <input type="email" id="ename" placeholder="e.g. abc@gmail.com " required>
        <br><br>

        <label for="cnt"> Contact No. : </label>
        <input type="number" id="cnt" required>
        <br><br>

        <label for="pwd">    Password. : </label>
        <input type="password" id="pwd" placeholder="fill password" required>
        <br><br>

        <label for="fdate"> Date. : </label>
        <input type="date" id="fdate" required>
        <br><br>

        <label for="dt"> Date and Time : </label>
        <input type="datetime-local" id="dt" required>
        <br><br>

        <label for="ui"> Upload image. : </label>
        <input type="file" id="ui" required>
        <br><br>

        <label for="yos">    Select Year of Study  : </label>
        <select id="yos" required>
            <option value="" disabled> select one</option>
            <option value="1"> Year 1</option>
            <option value="2"> Year 2</option>
            <option value="3"> Year 3</option>
            <option value="4"> Year 4</option>
        </select>
        <br><br>

        <label>Gender</label><br>

        <input type="radio" id="Male" name="gender">
        <label for="Male">Male</label>
        <br>
        <input type="radio" id="Female" name="gender">
        <label for="Female">Female</label>
        <br>
        <input type="radio" id="Other" name="gender">
        <label for="Other">Other</label>
        <br>
        <input type="radio" id="PreferNot" name="gender">
        <label for="PreferNot">Prefer not to say</label>
        <br><br>

        <label> type of insurance </label>
        <br>
        <input type="checkbox" id="l" name="life">
        <label for="l">life</label>
        <br>
        <input type="checkbox" id="h" name="house">
        <label for="h">house</label>
        <br>
        <input type="checkbox" id="c" name="car">
        <label for="c">car</label>
        <br>
        <input type="checkbox" id="hi" name="insurance">
        <label for="hi">Health Insurance</label>
        <br>
        <input type="checkbox" id="e" name="electronics">
        <label for="e">electronics</label>
        <br><br>

        <label for="message">Message</label><br>
        <textarea id="message" name="message" cols="56" rows="10"></textarea>
        <br><br>

        <button type="submit">Register</button>

    </form>
    </div>

</body>
</html>
